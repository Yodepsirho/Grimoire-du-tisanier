<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recettes du Comptoir des Tisaniers</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf6;--ink:#2b3a2e;--mute:#6b7a6c;--acc:#3f7d58;--line:#ddd6c2;--chip:#e8e3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b16;--card:#1d2720;--ink:#e6eadb;--mute:#93a595;--acc:#7fc79a;--line:#2e3d32;--chip:#26332a}}
:root[data-theme="dark"]{--bg:#141b16;--card:#1d2720;--ink:#e6eadb;--mute:#93a595;--acc:#7fc79a;--line:#2e3d32;--chip:#26332a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:1.8rem}
.sub{color:var(--mute);margin:4px 0 18px;font-style:italic}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.pick{grid-template-columns:1fr}}
label{font-size:.85rem;color:var(--mute);display:block;margin-bottom:3px}
select,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
button{cursor:pointer;background:var(--acc);color:var(--bg);border-color:var(--acc);margin-top:10px}
.res{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.res h2{margin:0 0 4px;font-size:1.3rem}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--chip);margin:0 6px 8px 0}
.none h2{color:var(--mute)}
.meta{color:var(--mute);font-size:.9rem}
details{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:bold}
.fam{margin:10px 0}.fam b{color:var(--acc)}
.fx{border-top:1px solid var(--line);padding:8px 0;font-size:.92rem}
.fx i{color:var(--mute)}
.bad{margin-top:12px;padding:10px 12px;border-left:3px solid #b3402e;background:var(--chip);border-radius:6px;font-size:.93rem}
</style></head><body><main>
<h1>⚗️ Recettes du Comptoir</h1>
<p class="sub">Deux ingrédients, une infusion : à vous de voir ce qu'elle donne… (effets pour aventuriers de niveau 9 et plus)</p>
<div class="pick">
<div><label for="a">Premier ingrédient</label><select id="a"></select></div>
<div><label for="b">Second ingrédient</label><select id="b"></select></div>
</div>
<button id="r">🎲 Mélanger au hasard</button>
<div class="res" id="out"></div>
<details><summary>Familles d'ingrédients</summary><div id="fams"></div></details>
<details><summary>Grimoire des effets (MJ)</summary><div id="fx"></div></details>
</main>
<script>
const F={
A:["🌼 Apaisantes",[["Camomille dorée",2],["Mélisse citronnée",2],["Reine-des-prés",3],["Lavande des bois",3],["Fleur de Ninnie",7],["Rosée d'Ashaba",9],["Larme de dryade",30]]],
V:["💪 Vigoureuses",[["Menthe sauvage",1],["Thym des clairières",2],["Églantier sauvage",3],["Gueule-de-loup de Cormanthor",4],["Baie-renard",4],["Racine de rosépine",5],["Medquat",6],["Rose de la Folie d'Abarath",80]]],
E:["🛡️ Écorces et feuillages",[["Ortie argentée",2],["Sauge des sous-bois",3],["Trèfle étoilé",10],["Feuille de cèdre bleu",6],["Écorce de chêne-cloche",8],["Lierre d'Arbres Enchevêtrés",65],["Sarphilette",70]]],
L:["🌙 Lunaires",[["Fougère-de-lune",5],["Lichen de brume",8],["Mousse de clair-de-lune",20],["Tintinabulette",25],["Orchidée de Sélune",55],["Fougère des Voix Perdues",60],["Fleur des Trois Lunes",90],["Étoile de la Mer de Lune",150],["Orchidée des Ruines",250]]],
M:["✨ Mythalliques",[["Feuille du Mythal",35],["Lys d'Oacenth",40],["Mousse des pierres chantantes",45],["Lotus du Mythal",100],["Mousse mythalline",200],["Fleur du Premier Mythal",500]]],
N:["🍃 Inertes",[["Mousse ivoire",4],["Herbe-zèbre",5],["Étoile fanée",50]]]};
const X={
AA:["Sérénité",["Avantage aux JS contre charmé et effrayé.","Avantage aux JS contre charmé et effrayé, et met fin à un effet de charme ou d'effroi en cours.","Immunité à charmé et effrayé."]],
AE:["Rempart de l'esprit",["Avantage aux JS d'Intelligence, de Sagesse et de Charisme.","Avantage aux JS d'Intelligence, de Sagesse et de Charisme, et résistance aux dégâts psychiques.","Avantage aux JS d'Intelligence, de Sagesse et de Charisme, et immunité aux dégâts psychiques."]],
AL:["Songe lucide",["Au prochain repos long : un songe vague répond à une question (oui, non, peut-être).","Au prochain repos long : un songe précis, comme le sort Augure.","Au prochain repos long : comme le sort Communion."],"jusqu'au prochain repos long"],
AM:["Éclat apaisant",["Le prochain sort de soin du buveur soigne +1d8 PV.","Le prochain sort de soin du buveur soigne +2d8 PV.","Le prochain sort de soin du buveur soigne +4d8 PV."]],
AV:["Reprise de souffle",["Soigne 2d8+4 PV.","Soigne 4d8+8 PV.","Soigne 8d8+16 PV et retire un niveau d'épuisement."],"instantané"],
EE:["Peau d'écorce",["+1 CA.","+1 CA et résistance au poison.","+2 CA et résistance aux dégâts contondants, perforants et tranchants non magiques."]],
EL:["Voile de brume",["Résistance aux dégâts nécrotiques.","Résistance aux dégâts nécrotiques et radiants.","Résistance aux dégâts nécrotiques et radiants ; ne peut pas être surpris."]],
EM:["Égide du Mythal",["Avantage aux JS contre les sorts.","Avantage aux JS contre les sorts et résistance aux dégâts des sorts.","Avantage aux JS contre les sorts et résistance aux dégâts des sorts ; de plus, une fois, un sort de niveau 3 ou moins qui cible le buveur est annulé."]],
EV:["Endurance",["Avantage aux JS de Constitution.","Avantage aux JS de Constitution et résistance au feu ou au froid (au choix à la prise).","Avantage aux JS de Constitution et résistance au feu, au froid, à la foudre et à l'acide."]],
LL:["Œil de la nuit",["Vision dans le noir 18 m.","Vision dans le noir 36 m et avantage en Discrétion.","Vision lucide 18 m : perçoit les créatures invisibles."]],
LM:["Vision du Mythal",["Détection de la magie à volonté, sans emplacement.","Détection de la magie à volonté, sans emplacement, et Compréhension des langues à volonté.","Détection de la magie et Compréhension des langues à volonté, sans emplacement, et Clairvoyance une fois."]],
LV:["Pas de l'ombre",["Vitesse +3 m et avantage en Discrétion.","Vitesse +6 m, avantage en Discrétion, ne laisse aucune trace.","Vitesse +9 m, se cacher en action bonus, ne laisse aucune trace."]],
MM:["Flux du Mythal",["Récupère un emplacement de sort de niveau 2.","Récupère un emplacement de sort de niveau 4.","Récupère un emplacement de sort de niveau 5."],"instantané"],
MV:["Surcharge arcanique",["Une fois par tour : +1d6 dégâts à un sort infligeant des dégâts.","Une fois par tour : +2d6 dégâts à un sort infligeant des dégâts.","Une fois par tour : +4d6 dégâts à un sort infligeant des dégâts ; 1 niveau d'épuisement à la fin."]],
VV:["Coup de fouet",["15 points de vie temporaires.","30 points de vie temporaires.","60 points de vie temporaires et vitesse +3 m."]]};
const Z={
AA:"Torpeur : le buveur sombre dans un sommeil profond (inconscient) pendant 1 minute ; il se réveille s'il subit des dégâts ou si on le secoue.",
AE:"Esprit brouillé : désavantage aux JS d'Intelligence, de Sagesse et de Charisme pendant 1 heure.",
AL:"Cauchemar : le songe est trompeur ; le buveur ne récupère ni PV ni dés de vie à son repos long et subit {d} dégâts psychiques.",
AM:"Reflux : le prochain sort de soin du buveur fonctionne, mais le buveur subit lui-même {d} dégâts nécrotiques.",
AV:"Nausée : le buveur subit {d} dégâts de poison et est empoisonné pendant 1 heure.",
EE:"Peau de bois cassante : CA −1 et vulnérabilité au feu pendant 1 heure.",
EL:"Brume dans les yeux : le buveur est aveuglé pendant 1 minute ; JS de Constitution à la fin de chacun de ses tours pour y mettre fin.",
EM:"Aimant à sorts : désavantage aux JS contre les sorts pendant 1 heure.",
EV:"Courbatures : 1 niveau d'épuisement et désavantage aux JS de Constitution pendant 1 heure.",
LL:"Nuit permanente : le buveur est aveuglé pendant 1 heure.",
LM:"Murmures du Mythal : désavantage aux tests de Perception et aux jets de concentration pendant 1 heure.",
LV:"Ombre capricieuse : l'ombre du buveur trahit sa position ; désavantage en Discrétion et vitesse −3 m pendant 1 heure.",
MM:"Décharge : le buveur perd un emplacement de sort (le plus haut niveau dispo, 4 maximum) et subit {d} dégâts de force.",
MV:"Retour de flamme : le prochain sort du buveur infligeant des dégâts lui inflige aussi {d} dégâts de force, et 1 niveau d'épuisement.",
VV:"Cœur emballé : le buveur subit {d} dégâts de poison et a désavantage aux jets d'attaque pendant 1 minute."};
const Y={
AA:["Bâillement contagieux","Le buveur bâille sans cesse, et ses compagnons aussi. Il a avantage à son prochain test de Persuasion.","f"],
AE:["Voix de crapaud","La voix du buveur devient grave et rauque pendant 1 heure. Aucun effet mécanique, mais le MJ s'amuse.","f"],
AL:["Lucioles dans la tête","De petites lueurs colorées flottent autour de la tête du buveur (lumière faible, 1,5 m). Purement esthétique.","f"],
AV:["Fou rire","Le buveur éclate de rire à tout propos : désavantage aux tests de Discrétion.","b"],
EE:["Plaques d'urticaire","Le buveur est couvert de plaques rouges : désavantage aux tests de Charisme.","b"],
EL:["Haleine de brume","Chaque expiration forme un petit nuage glacé. Aucun effet mécanique.","f"],
EV:["Courbatures légères","Vitesse −1,5 m.","b"],
LL:["Yeux de chat","Pupilles fendues et brillantes : vision dans le noir 9 m.","f"],
LV:["Vertiges","Le buveur a désavantage à son prochain jet d'initiative.","b"],
VV:["Jambes frétillantes","Le buveur ne peut s'empêcher de sautiller : vitesse +1,5 m.","f"],
AN:["Goût délicieux","Le buveur en redemande, et se sent bien : 5 points de vie temporaires.","f"],
EN:["Goût de sciure","Le buveur ne sent plus rien : désavantage aux tests de Perception basés sur l'odorat et le goût.","b"],
LN:["Étoiles dans les yeux","Le regard du buveur reflète les étoiles, même en plein jour. Aucun effet mécanique.","f"],
MN:["Éternuements d'étincelles","Au pire moment (choix du MJ), le buveur éternue des étincelles : il subit 1d4 dégâts de feu.","b"],
NV:["Joues rouges","Le buveur transpire à grosses gouttes : avantage aux JS contre les effets de froid.","f"],
NN:["Eau chaude","Aucun effet… mais le buveur jure que c'était délicieux.","0"]};
const ya=Object.keys(Y).map(k=>`<div class="fx"><b>${Y[k][0]}</b> <i>(${[...k].map(c=>F[c][0].split(" ")[1]).join(" + ")} : ${Y[k][2]=="b"?"désastre mineur":Y[k][2]=="f"?"amusant":"rien"})</i><br>${Y[k][1]}</div>`).join("");
const DD=[12,15,18],DI=["2d6","4d6","8d6"],z=(k,t)=>Z[k].replace(/\{d\}/g,DI[t]);
const TN=["Léger","Marqué","Exceptionnel"],DU=["1 heure","8 heures","24 heures"];
const I=[];for(const k in F)F[k][1].forEach(([n,p])=>I.push({n,p,f:k}));
const $=id=>document.getElementById(id);
const opts=()=>Object.keys(F).map(k=>`<optgroup label="${F[k][0]}">`+F[k][1].map(([n])=>`<option value="${I.findIndex(i=>i.n==n)}">${n}</option>`).join("")+"</optgroup>").join("");
$("a").innerHTML=$("b").innerHTML=opts();$("b").selectedIndex=3;
function show(){
 const a=I[$("a").value],b=I[$("b").value],s=a.p+b.p;let h,c="res";
 const pair=`<div class="meta">${a.n} + ${b.n}</div>`;
 if(a.f=="N"||b.f=="N"||s<=10){const y=Y[[a.f,b.f].sort().join("")];c+=y[2]=="0"?" none":"";h=`<h2>${y[0]}</h2><span class="tag">Anecdotique</span>${y[2]=="0"?"":'<span class="tag">Durée : 1 heure</span>'}${pair}`+(y[2]=="b"?`<div class="bad"><b>Désastre mineur</b> : ${y[1]}</div>`:`<p>${y[1]}</p>`)}
 
 else{const t=s<=60?0:s<=200?1:2,k=[a.f,b.f].sort().join(""),e=X[k];
  h=`<h2>${e[0]}</h2><span class="tag">${TN[t]}</span><span class="tag">Durée : ${e[2]||DU[t]}</span>${pair}<p>${e[1][t]}</p><div class="bad"><b>Jet de préparation raté</b> (outils d'herboriste ou Intelligence (Nature), DD ${DD[t]}) : ${z(k,t)}</div>`}
 $("out").className=c;$("out").innerHTML=h}
$("a").onchange=$("b").onchange=show;
$("r").onclick=()=>{$("a").value=Math.floor(Math.random()*I.length);$("b").value=Math.floor(Math.random()*I.length);show()};
$("fams").innerHTML=Object.keys(F).map(k=>`<div class="fam"><b>${F[k][0]}</b><br>${F[k][1].map(i=>i[0]).join(", ")}</div>`).join("");
$("fx").innerHTML="<p class='meta'>Effet = familles des deux ingrédients. Puissance selon la somme des prix : ≤10 ou ingrédient inerte : effet anecdotique (amusant ou désastre mineur, sans jet), 11–60 léger, 61–200 marqué, 201+ exceptionnel.</p><p class='meta'><b>Effets anecdotiques</b></p>"+ya+"<p class='meta'><b>Effets selon les familles</b></p>"+Object.keys(X).map(k=>`<div class="fx"><b>${X[k][0]}</b> <i>(${[...k].map(c=>F[c][0].split(" ")[1]).join(" + ")})</i>${X[k][1].map((t,i)=>`<br><b>${TN[i]}</b> (somme ${["11–60","61–200","201+"][i]}, durée ${X[k][2]||DU[i]}) : ${t}<br>&nbsp;&nbsp;↳ <i>Échec (DD ${DD[i]})</i> : ${z(k,i)}`).join("")}</div>`).join("");
show();
</script></body></html>
